[theme]
primaryColor     = "#3b82f6"
backgroundColor  = "#07090f"
secondaryBackgroundColor = "#0c1220"
textColor        = "#dce6f5"
font             = "sans serif"

[client]
showErrorDetails = false
toolbarMode      = "minimal"

[logger]
level = "info"

[server]
port           = 8501
headless       = true
runOnSave      = true
maxUploadSize  = 200
